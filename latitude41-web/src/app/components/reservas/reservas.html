<div class="min-h-screen bg-gradient-to-br from-navy via-slate-950 to-slate-900 text-white">
  <header class="border-b border-white/5 bg-navy/85 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 lg:px-8">
      <div>
        <h1 class="font-serif text-2xl font-bold tracking-wide text-white">Latitude 41</h1>
        <p class="mt-1 text-[9px] font-bold uppercase tracking-[0.28em] text-gold">Reservas Privadas</p>
      </div>

      <button
        type="button"
        routerLink="/home"
        class="rounded-sm border border-white/10 px-4 py-2 text-xs font-bold uppercase tracking-widest text-white/70 transition hover:border-gold/50 hover:bg-gold/10 hover:text-gold"
      >
        Voltar
      </button>
    </div>
  </header>

  <main class="relative flex min-h-[calc(100vh-89px)] items-center justify-center overflow-hidden px-5 py-16 lg:px-8">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(205,164,94,0.13),transparent_34%)]"></div>
    <div class="pointer-events-none absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-gold/35 to-transparent"></div>

    <section class="relative w-full max-w-2xl border border-gold/20 bg-navy/70 px-6 py-8 shadow-2xl shadow-black/30 backdrop-blur-sm sm:px-10 sm:py-11">
      <div class="mb-9 text-center">
        <p class="mb-4 text-xs font-bold uppercase tracking-[0.28em] text-gold">Latitude 41</p>
        <h2 class="font-serif text-4xl font-bold leading-tight text-white sm:text-5xl">Reserve a sua mesa</h2>
        <p class="mx-auto mt-5 max-w-xl text-sm leading-7 text-white/62">
          Escolha o momento ideal para uma experiência gastronómica pensada ao detalhe.
        </p>
      </div>

      <form class="space-y-7" (ngSubmit)="submeterReserva()">
        <div>
          <label for="data" class="mb-3 block text-xs font-bold uppercase tracking-[0.22em] text-gold">Data</label>
          <input
            id="data"
            name="data"
            type="date"
            [(ngModel)]="data"
            class="w-full rounded-sm border border-gold/25 bg-slate-950/55 px-4 py-4 text-sm text-white outline-none transition [color-scheme:dark] focus:border-gold focus:bg-slate-950/80 focus:ring-1 focus:ring-gold/40"
          />
        </div>

        <div>
          <label for="hora" class="mb-3 block text-xs font-bold uppercase tracking-[0.22em] text-gold">Horário</label>
          <select
            id="hora"
            name="hora"
            [(ngModel)]="hora"
            class="w-full rounded-sm border border-gold/25 bg-slate-950/55 px-4 py-4 text-sm text-white outline-none transition focus:border-gold focus:bg-slate-950/80 focus:ring-1 focus:ring-gold/40"
          >
            <option value="" disabled>Selecione um horário</option>
            <option *ngFor="let horario of horarios" [value]="horario">{{ horario }}</option>
          </select>
        </div>

        <div>
          <label for="pessoas" class="mb-3 block text-xs font-bold uppercase tracking-[0.22em] text-gold">Número de Pessoas</label>
          <select
            id="pessoas"
            name="pessoas"
            [(ngModel)]="quantidadePessoas"
            class="w-full rounded-sm border border-gold/25 bg-slate-950/55 px-4 py-4 text-sm text-white outline-none transition focus:border-gold focus:bg-slate-950/80 focus:ring-1 focus:ring-gold/40"
          >
            <option [ngValue]="null" disabled>Selecione a lotação</option>
            <option *ngFor="let pessoas of opcoesPessoas" [ngValue]="pessoas">{{ pessoas }} pessoa{{ pessoas > 1 ? 's' : '' }}</option>
          </select>
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full rounded-sm bg-gold px-8 py-4 text-xs font-bold uppercase tracking-widest text-navy shadow-2xl shadow-gold/20 transition hover:bg-[#d8b677] hover:shadow-gold/35 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ isSubmitting ? 'A confirmar...' : 'Confirmar Reserva' }}
        </button>
      </form>
    </section>
  </main>
</div>
