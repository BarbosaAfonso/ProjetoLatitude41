<div class="profile-page relative min-h-screen overflow-hidden text-white select-none">
  <div class="pointer-events-none absolute inset-0 bg-navy/50"></div>
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(205,164,94,0.15),transparent_36%)]"></div>

  <app-navbar [userName]="user?.nome ?? null" (logoutRequested)="logout()"></app-navbar>

  <main class="relative z-10 flex min-h-screen items-center justify-center px-5 pb-16 pt-40 lg:px-8">
    <section class="profile-card relative w-full max-w-xl rounded-3xl border border-gold/60 bg-navy/88 p-8 text-white shadow-2xl shadow-black/55 backdrop-blur-md transition-all duration-300 sm:p-10">
      <div
        class="profile-status-dot"
        [ngClass]="estadoPerfilClass()"
        [attr.title]="estadoPerfilLabel()"
        [attr.aria-label]="estadoPerfilLabel()"
        role="status"
      >
        <span class="profile-status-tooltip">{{ estadoPerfilLabel() }}</span>
      </div>

      <div class="mb-8 text-center">
        <p class="mb-3 text-xs font-bold uppercase tracking-[0.22em] text-gold">A Minha Conta</p>
        <h2 class="font-serif text-3xl font-bold leading-tight text-white">Dados de Perfil</h2>
        <p class="mx-auto mt-3 text-sm leading-relaxed text-white/70">
          Gerencie as suas informa&ccedil;&otilde;es de acesso no Latitude 41.
        </p>
      </div>

      <form class="space-y-6 text-white" (ngSubmit)="guardarAlteracoes()">
        <div class="flex flex-col gap-2">
          <label for="perfil-nome" class="text-[10px] font-bold uppercase tracking-wider text-white/78">Nome Completo</label>
          <input
            id="perfil-nome"
            name="nome"
            type="text"
            autocomplete="off"
            [(ngModel)]="nomeInput"
            class="profile-input w-full rounded-2xl border border-white/12 bg-[#0b2746]/72 px-4 py-3 text-sm text-white outline-none transition placeholder:text-white/42 focus:border-gold/80 focus:bg-[#0f3154]/82 focus:ring-2 focus:ring-gold/18"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="perfil-email" class="text-[10px] font-bold uppercase tracking-wider text-white/78">Endere&ccedil;o de E-mail</label>
          <input
            id="perfil-email"
            name="email"
            type="email"
            autocomplete="off"
            [(ngModel)]="emailInput"
            class="profile-input w-full rounded-2xl border border-white/12 bg-[#0b2746]/72 px-4 py-3 text-sm text-white outline-none transition placeholder:text-white/42 focus:border-gold/80 focus:bg-[#0f3154]/82 focus:ring-2 focus:ring-gold/18"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="perfil-password" class="text-[10px] font-bold uppercase tracking-wider text-white/78">Nova Password</label>
          <input
            id="perfil-password"
            name="password"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="passwordInput"
            placeholder="Deixe em branco para manter a atual"
            class="profile-input w-full rounded-2xl border border-white/12 bg-[#0b2746]/72 px-4 py-3 text-sm text-white outline-none transition placeholder:text-white/42 focus:border-gold/80 focus:bg-[#0f3154]/82 focus:ring-2 focus:ring-gold/18"
          />
          <p class="text-xs leading-relaxed text-white/48">
            Preencha este campo apenas se quiser alterar a password de acesso.
          </p>
        </div>

        <div class="border-t border-gold/15 pt-5">
          <p class="text-[10px] font-bold uppercase tracking-wider text-white/54">Tipo de Utilizador</p>
          <div class="mt-2 inline-flex rounded-full border border-gold/25 bg-[#0b2746]/58 px-4 py-2 text-[11px] font-bold uppercase tracking-[0.18em] text-gold">
            {{ tipoUtilizadorLabel() }}
          </div>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            [disabled]="isSaving"
            class="profile-submit login-submit mx-auto flex w-60 cursor-pointer justify-center rounded-full border border-gold bg-transparent px-6 py-3.5 text-xs font-bold uppercase tracking-widest text-gold shadow-lg shadow-gold/10 transition-colors duration-300 ease-out hover:bg-gold hover:text-navy hover:shadow-gold/30 focus:outline-none focus:ring-2 focus:ring-gold/60 disabled:cursor-not-allowed disabled:opacity-60"
          >
            @if (isSaving) {
              A Guardar...
            } @else {
              Guardar Altera&ccedil;&otilde;es
            }
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
