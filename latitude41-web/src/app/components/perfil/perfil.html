<div class="min-h-screen bg-gradient-to-br from-navy via-slate-950 to-slate-900 text-white select-none">
  <app-navbar [userName]="user?.nome ?? null" (logoutRequested)="logout()"></app-navbar>

  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-5 pb-16 pt-40 lg:px-8">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(205,164,94,0.13),transparent_34%)]"></div>
    <div class="pointer-events-none absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-gold/35 to-transparent"></div>

    <section class="relative w-full max-w-xl border border-gold/20 bg-navy/70 px-6 py-8 shadow-2xl shadow-black/30 backdrop-blur-sm sm:px-10 sm:py-11">

      <div class="mb-8 text-center">
        <p class="mb-3 text-xs font-bold uppercase tracking-[0.22em] text-gold">A Minha Conta</p>
        <h2 class="font-serif text-3xl font-bold leading-tight text-white">Dados de Perfil</h2>
        <p class="mx-auto mt-2 text-xs leading-relaxed text-white/60">
          Gerencie as suas informações de acesso e consulte o estado da sua conta no Latitude 41.
        </p>
      </div>

      <form class="space-y-6" (ngSubmit)="guardarAlteracoes()">

        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-gold">Nome Completo</label>
          <input
            name="nome"
            type="text"
            autocomplete="off"
            [(ngModel)]="nomeInput"
            class="w-full rounded-sm border border-gold/25 bg-slate-950/55 px-4 py-3.5 text-sm text-white outline-none transition focus:border-gold focus:bg-slate-950/80 focus:ring-1 focus:ring-gold/40"
          />
        </div>

        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-gold">Endereço de E-mail</label>
          <input
            name="email"
            type="email"
            autocomplete="off"
            [(ngModel)]="emailInput"
            class="w-full rounded-sm border border-gold/25 bg-slate-950/55 px-4 py-3.5 text-sm text-white outline-none transition focus:border-gold focus:bg-slate-950/80 focus:ring-1 focus:ring-gold/40"
          />
        </div>

        <div class="grid grid-cols-2 gap-4 pt-2 border-t border-white/5">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-gold mb-1">Tipo de Utilizador</p>
            <div class="rounded-sm bg-slate-950/40 px-3 py-2.5 text-xs text-white/70 font-mono border border-white/5 uppercase">
              {{ user?.tipo || 'Cliente' }}
            </div>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-gold mb-1">Estado da Conta</p>
            <div class="rounded-sm bg-slate-950/40 px-3 py-2.5 text-xs text-emerald-400 font-mono border border-white/5 uppercase flex items-center gap-1.5">
              <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              {{ user?.estadoConta || 'Ativa' }}
            </div>
          </div>
        </div>

        <div class="pt-4">
          <button
            type="submit"
            [disabled]="isSaving"
            class="w-full rounded-sm bg-gold px-8 py-4 text-xs font-bold uppercase tracking-widest text-navy shadow-xl shadow-gold/15 transition hover:bg-[#d8b677] hover:shadow-gold/25 disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ isSaving ? 'A Guardar...' : 'Guardar Alterações' }}
          </button>
        </div>

      </form>
    </section>
  </main>
</div>
