<div class="min-h-screen bg-gradient-to-br from-navy via-slate-950 to-slate-900 text-white">
  <header class="fixed inset-x-0 top-0 z-50 border-b border-white/5 bg-navy/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl flex-col gap-5 px-5 py-4 lg:flex-row lg:items-center lg:justify-between lg:px-8">
      <div>
        <h1 class="font-serif text-2xl font-bold tracking-wide text-white">Latitude 41</h1>
        <p class="mt-1 text-[9px] font-bold uppercase tracking-[0.28em] text-gold">Curadoria Gastronómica</p>
      </div>

      <nav class="flex items-center gap-6 text-sm font-medium text-white/65 lg:absolute lg:left-1/2 lg:-translate-x-1/2">
        <a href="#" class="text-gold transition hover:text-gold">Início</a>
        <a href="#" class="transition hover:text-gold">Menu</a>
        <a href="#" class="transition hover:text-gold">Reservas</a>
      </nav>

      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2 rounded-sm border border-white/10 bg-white/5 px-3 py-2 text-sm text-white/80">
          <svg class="h-4 w-4 text-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />
          </svg>
          <span>{{ user?.nome }}</span>
        </div>

        <button
          type="button"
          (click)="logout()"
          class="rounded-sm border border-white/10 px-4 py-2 text-xs font-bold uppercase tracking-widest text-white/75 transition hover:border-gold/50 hover:bg-gold/10 hover:text-gold"
        >
          Sair
        </button>
      </div>
    </div>
  </header>

  <main class="relative flex min-h-screen items-center overflow-hidden px-5 pb-16 pt-40 sm:pt-36 lg:px-8">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(205,164,94,0.16),transparent_34%)]"></div>
    <div class="pointer-events-none absolute inset-x-8 bottom-0 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent"></div>

    <section class="relative mx-auto flex max-w-5xl flex-col items-center text-center">
      <p class="mb-6 text-xs font-bold uppercase tracking-[0.28em] text-gold">{{ currentDate }}</p>

      <h2 class="max-w-4xl font-serif text-4xl font-bold leading-tight text-white sm:text-5xl lg:text-7xl">
        Olá, {{ user?.nome }}! Seja bem-vindo ao Latitude 41.
      </h2>

      <p class="mt-7 max-w-2xl text-base leading-8 text-white/68 sm:text-lg">
        Descubra uma curadoria gastronómica onde cada prato conta uma história e cada momento se torna memorável.
      </p>

      <div class="mt-10 flex w-full flex-col items-stretch justify-center gap-4 sm:w-auto sm:flex-row">
        <button
          type="button"
          class="rounded-sm bg-gold px-8 py-4 text-xs font-bold uppercase tracking-widest text-navy shadow-2xl shadow-gold/20 transition hover:bg-[#d8b677] hover:shadow-gold/35"
        >
          Reservar Mesa
        </button>

        <button
          type="button"
          class="rounded-sm border border-gold/70 bg-transparent px-8 py-4 text-xs font-bold uppercase tracking-widest text-white transition hover:bg-gold/10 hover:text-gold"
        >
          Conhecer o Menu
        </button>
      </div>
    </section>
  </main>
</div>
